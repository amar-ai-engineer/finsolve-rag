[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, pyupgrade.
# Chosen explicitly so CI does not change when ruff's defaults change.
select = ["E", "F", "I", "B", "UP"]
# Long lines are mostly prompt text and UI copy; wrapping them hurts readability.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
